site_name: EXPO Documentation
site_description: Crystal structure solution by powder diffraction data
site_author: IC-CNR Bari
site_url: https://ccorrado71.github.io/expo-docs/
repo_url: https://github.com/ccorrado71/expo-docs
repo_name: expo-docs
docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  logo: images/expo_icon.png
  favicon: images/expo_icon.png
  palette:
    - scheme: default
      primary: indigo
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
