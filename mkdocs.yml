site_name: EXPO Documentation
site_description: Crystal structure solution by powder diffraction data
site_author: IC-CNR Bari
site_url: https://iccnr-xtal.github.io/expo-docs/
repo_url: https://github.com/iccnr-xtal/expo-docs
repo_name: expo-docs
docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  logo: images/expo_icon.png
  favicon: images/expo_icon.png
  palette:
    - scheme: default
      primary: indigo
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Download: download.md
  - Installation: installation.md
  - Tutorials: tutorials.md
  - Input File:
    - Preparing the input file: input/index.md
    - Commands: input/commands.md
    - The %data command: input/data.md
    - Structure files: input/structure-files.md
  - Indexing: indexing.md
  - Space Group: space-group.md
  - Direct Methods:
    - Overview: direct-methods/index.md
    - Extraction of the intensities: direct-methods/extraction.md
    - Normalization: direct-methods/normalization.md
    - Structure invariants: direct-methods/invariants.md
    - Phasing by the tangent formula: direct-methods/phasing.md
    - Fourier map and model optimization: direct-methods/fourier.md
  - Direct Space:
    - Overview: direct-space/index.md
    - Directives and restraints: direct-space/directives.md
    - Parallel execution: direct-space/parallel.md
    - Examples: direct-space/examples.md
  - Rietveld: rietveld.md
  - Tools:
    - Overview: tools/index.md
    - Geometry optimization: tools/geometry-optimization.md
    - Bond valence sum: tools/bond-valence.md
  - Appendices:
    - "A: Average volume of the atoms": appendix/atomic-volumes.md
    - "B: Extinction symbols": appendix/extinction-symbols.md

# Pages built but not in the navigation: drafts, and the changelog (linked
# from the download page)
not_in_nav: |
  /changelog.md
  /rietveld-theory.md
  /superflip.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
